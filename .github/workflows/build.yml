name: BuildCore

on:
  workflow_call:

jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: 仓库检出
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: 安装前端依赖
        run: pnpm install

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译
        run: pnpm tauri build

      - name: 打包单文件版
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/wc.exe"
          if (-not (Test-Path $exe)) { Write-Error "wc.exe not found"; exit 1 }
          Compress-Archive -Path $exe -DestinationPath "dist/WindowsCleaner.zip"
          Write-Output "Packaged: WindowsCleaner.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCleaner
          path: dist/WindowsCleaner.zip
