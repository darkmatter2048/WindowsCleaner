name: BuildCore

on:
  workflow_call:

jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: 仓库检出
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: 安装前端依赖
        run: pnpm install

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译
        run: pnpm tauri build

      - name: 打包待签名文件
        shell: pwsh
        run: |
          $dest = "dist/to-sign"
          New-Item -ItemType Directory -Force -Path $dest

          # 便携版 exe
          $exe = "src-tauri/target/release/wc.exe"
          if (Test-Path $exe) { Copy-Item $exe $dest }

          # MSI 安装包
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($msi) { Copy-Item $msi.FullName $dest }

          # NSIS 安装包
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName $dest }

          # 打包成 zip
          Compress-Archive -Path "$dest/*" -DestinationPath "dist/WindowsCleaner-unsigned.zip"

          Write-Output "=== 待签名文件 ==="
          Get-ChildItem $dest | ForEach-Object { Write-Output $_.Name }

      - name: 上传待签名包
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCleaner-unsigned
          path: dist/WindowsCleaner-unsigned.zip
