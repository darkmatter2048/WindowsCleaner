name: BuildCore

on:
  workflow_call:
    inputs:
      sign:
        required: false
        type: boolean
        default: false

jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: 仓库检出
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: 安装前端依赖
        run: pnpm install

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 编译
        run: pnpm tauri build

      - name: 上传未签名的主程序
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: src-tauri/target/release/wc.exe

      - name: 提交代码签名请求 (SignPath)
        if: ${{ inputs.sign }}
        id: submit-signing-request
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "WindowsCleaner"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "sign-exezip"
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 打包并上传最终产物
        shell: pwsh
        run: |
          # Prefer signed exe; fall back to unsigned
          $exe = "signed/wc.exe"
          if (-not (Test-Path $exe)) { $exe = "src-tauri/target/release/wc.exe" }
          Compress-Archive -Path $exe -DestinationPath "dist/WindowsCleaner.zip"

      - name: 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: WindowsCleaner
          path: dist/WindowsCleaner.zip
